# Main training configuration. Edit this file, then run: python train.py

experiment:
  name: exdark_yolo11s_baseline
  stage: baseline
  module: baselines
  note: initial baseline

train:
  model: weights/pretrained/yolo11s.pt
  data: datasets_yolo/ExDark_YOLO/exdark.yaml
  epochs: 100
  imgsz: 640
  batch: 16
  device: 0
  workers: 8
  seed: 42
  optimizer: auto
  lr0: 0.01
  patience: 50
  pretrained: true
  exist_ok: true

output:
  project_root: runs
  save_period: -1
