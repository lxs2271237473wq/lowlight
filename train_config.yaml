experiment:
  name: aodraw_yolo11s_lqa_loss_warmup
  stage: module1
  module: module1_lqa_loss
  note: loss-level low-quality-aware weighting with warmup and clipping
train:
  model: weights/pretrained/yolo11s.pt
  data: datasets_yolo/AODRaw_sRGB_YOLO/aodraw.yaml
  epochs: 100
  imgsz: 640
  batch: 16
  device: 0
  workers: 8
  seed: 42
