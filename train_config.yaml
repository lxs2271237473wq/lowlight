  lr0: 0.01
  patience: 100
  pretrained: true
  exist_ok: true
lqa_loss:
  enabled: true
  alpha: 0.25
  max_weight: 1.25
  warmup_epochs: 20
  small_area_thr: 0.01
  darkness_weight: 0.6
  small_weight: 0.4
  object_level: false
  batch_level_weight: true
output:
  project_root: runs
  save_period: -1
