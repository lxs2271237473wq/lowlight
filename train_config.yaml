# Main training configuration. Edit this file, then run: python train.py

experiment:
  name: exdark_yolo11s_lqa_weight
  stage: module1
  module: module1_lqa_weight
  note: lqa sampling weight for small-dark objects

train:
  model: weights/pretrained/yolo11s.pt
  data: runs/module1_lqa_weight/exdark_lqa.yaml
  epochs: 100
  imgsz: 640
  batch: 16
  device: 0
  workers: 8
  seed: 42
  optimizer: auto
  lr0: 0.01
  patience: 50
  pretrained: true
  exist_ok: true

output:
  project_root: runs
  save_period: -1
